<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СМУТА: Иллюзия власти</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;500;800&family=Courier+Prime:wght@400;700&display=swap');

        :root {
            --bg-color: #0a0a0a;
            --text-main: #f0f0e6;
            --accent-gold: #c5a059;
            --accent-blood: #8b0000;
            --card-bg: #141414;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            transition: background-image 1s ease-in-out;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Наложение текстуры киноленты и старой бумаги */
        .overlay-texture {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: -1;
            background: 
                radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.95) 100%),
                url('https://www.transparenttextures.com/patterns/stucco.png');
            opacity: 1;
            transition: opacity 1s ease;
        }

        /* Эффект камеры на фоне */
        .camera-ui {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            border: 2px solid rgba(255,255,255,0.05);
        }

        .camera-ui::before, .camera-ui::after {
            content: ''; position: absolute; width: 50px; height: 50px;
        }
        .camera-ui::before { top: 20px; left: 20px; border-top: 2px solid #fff; border-left: 2px solid #fff; opacity: 0.3; }
        .camera-ui::after { bottom: 20px; right: 20px; border-bottom: 2px solid #fff; border-right: 2px solid #fff; opacity: 0.3; }

        .rec-indicator {
            position: fixed; top: 30px; left: 40px;
            color: var(--accent-blood); font-weight: 800; font-size: 1.2rem;
            letter-spacing: 2px; z-index: 10000;
            display: flex; align-items: center; gap: 10px;
            text-shadow: 0 0 10px var(--accent-blood);
        }

        .rec-dot {
            width: 15px; height: 15px; background-color: var(--accent-blood);
            border-radius: 50%; animation: blink 1s infinite;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        .timecode {
            position: fixed; top: 30px; right: 40px;
            font-family: 'Courier Prime', monospace; font-size: 1.2rem;
            z-index: 10000; color: rgba(255,255,255,0.5);
        }

        /* Навигация */
        nav {
            padding: 40px; text-align: center; margin-top: 30px;
            position: relative; z-index: 10;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 5rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 8px;
            margin-bottom: 10px; color: var(--accent-gold);
            text-shadow: 2px 2px 20px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 1.2rem; color: #aaa; letter-spacing: 4px;
            text-transform: uppercase; margin-bottom: 40px;
            font-family: 'Courier Prime', monospace;
        }

        .tabs {
            display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--accent-gold); color: var(--accent-gold);
            padding: 15px 40px; font-size: 1.1rem;
            font-family: 'Cormorant Garamond', serif; font-weight: 700;
            cursor: pointer; transition: all 0.4s;
            text-transform: uppercase; letter-spacing: 2px;
            backdrop-filter: blur(5px);
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-blood);
            border-color: var(--accent-blood); color: #fff;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.8);
        }

        /* Контентные секции */
        .section {
            display: none; padding: 0 50px 100px;
            max-width: 1400px; margin: 0 auto;
            animation: fadeIn 0.8s ease-in-out;
            position: relative; z-index: 10;
        }

        .section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* ВЫБОР СЕЗОНОВ (Плитки без спойлеров) */
        .seasons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 30px;
        }

        .season-tile {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid #333;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        .season-tile::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover; background-position: center;
            opacity: 0.2; transition: 0.5s; z-index: 0;
        }

        .season-tile:hover {
            border-color: var(--accent-gold);
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .season-tile:hover::before { opacity: 0.5; transform: scale(1.05); }

        .season-tile-content { position: relative; z-index: 2; }

        .season-tile h2 {
            font-family: 'Cormorant Garamond', serif; font-size: 2.5rem;
            color: var(--text-main); margin-bottom: 10px;
        }

        .season-tile .s-subtitle {
            font-family: 'Montserrat', sans-serif; font-size: 0.9rem;
            color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px;
        }

        /* ДЕТАЛИ СЕЗОНА (Открывается при клике) */
        .season-detail-header {
            display: flex; align-items: center; gap: 20px; margin-bottom: 40px;
        }

        .back-btn {
            background: transparent; border: 1px solid var(--accent-gold);
            color: var(--accent-gold); padding: 10px 20px; cursor: pointer;
            font-family: 'Courier Prime', monospace; text-transform: uppercase;
            transition: 0.3s;
        }

        .back-btn:hover { background: var(--accent-gold); color: #000; }

        .season-info-box {
            background: rgba(0,0,0,0.75);
            border: 1px solid var(--accent-gold);
            padding: 50px; margin-bottom: 50px;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .sd-title {
            font-family: 'Cormorant Garamond', serif; font-size: 3.5rem;
            color: var(--accent-gold); margin-bottom: 10px; line-height: 1.1;
        }
        .sd-conflict {
            font-weight: 800; color: var(--accent-blood);
            margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px;
            font-size: 1.2rem;
        }
        .sd-text {
            font-size: 1.2rem; line-height: 1.8; color: #ddd; margin-bottom: 30px;
        }
        .sd-conclusion {
            padding: 20px; background: rgba(139,0,0,0.2);
            border-left: 4px solid var(--accent-gold);
            font-family: 'Courier Prime', monospace; font-size: 1.1rem;
        }

        .section-divider {
            font-family: 'Cormorant Garamond', serif; font-size: 2.5rem;
            color: var(--text-main); text-align: center; margin: 60px 0 40px;
            text-transform: uppercase; letter-spacing: 4px; border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        /* ДОСЬЕ ПЕРСОНАЖЕЙ (КАРТОЧКИ) */
        .char-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px; perspective: 1000px;
        }

        .char-card { height: 480px; cursor: pointer; }

        .char-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.8s; transform-style: preserve-3d;
        }
        .char-card:hover .char-inner { transform: rotateY(180deg); }

        .char-front, .char-back {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border: 1px solid #333; display: flex; flex-direction: column;
            background-color: #0f0f0f;
        }

        .char-front {
            align-items: center; background-size: cover; background-position: top center;
        }
        
        .char-front::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.95) 100%);
        }

        .char-front-content {
            position: absolute; bottom: 20px; left: 0; width: 100%; padding: 0 20px; z-index: 2;
        }

        .char-role {
            color: var(--accent-gold); font-size: 0.8rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px;
            font-family: 'Courier Prime', monospace;
        }

        .char-name {
            font-family: 'Cormorant Garamond', serif; font-size: 2.2rem;
            font-weight: 700; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,1);
        }

        .char-back {
            background: #111 url('https://www.transparenttextures.com/patterns/stucco.png');
            transform: rotateY(180deg); text-align: left; padding: 30px 20px;
            overflow-y: auto; border-color: var(--accent-gold);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
        }
        
        .char-back::-webkit-scrollbar { width: 4px; }
        .char-back::-webkit-scrollbar-thumb { background: var(--accent-blood); }

        .back-header {
            border-bottom: 1px solid var(--accent-gold); padding-bottom: 10px; margin-bottom: 15px;
            color: var(--accent-blood); font-family: 'Courier Prime', monospace;
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;
        }

        .char-detail { margin-bottom: 15px; font-size: 0.9rem; line-height: 1.6; }
        .char-detail strong {
            color: var(--accent-gold); display: block; margin-bottom: 3px;
            text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px;
        }
        .char-detail p { color: #ccc; }
    </style>
</head>

    <div class="overlay-texture" id="bgOverlay"></div>

        // Генерация HTML карточки персонажа
        function getCharCardHTML(charId) {
            const c = charactersData[charId];
            return `
            <div class="char-card">
                <div class="char-inner">
                    <div class="char-front" style="${c.style}">
                        <div class="char-front-content">
                            <div class="char-role">${c.role}</div>
                            <div class="char-name">${c.name}</div>
                        </div>
                    </div>
                    <div class="char-back">
                        <div class="back-header">ДОСЬЕ: СЕКРЕТНО // АРХИВ</div>
                        <div class="char-detail"><strong>Личность:</strong><p>${c.desc}</p></div>
                        <div class="char-detail"><strong>Действия в сюжете:</strong><p>${c.actions}</p></div>
                        <div class="char-detail"><strong>Итог:</strong><p>${c.result}</p></div>
                    </div>
                </div>
            </div>`;
        }

        // Рендер всех карточек в архив
        function renderAllCasting() {
            const grid = document.getElementById('allCharGrid');
            grid.innerHTML = '';
            for (let id in charactersData) {
                grid.innerHTML += getCharCardHTML(id);
            }
        }
        renderAllCasting();

        // Сброс активных вкладок
        function hideAllSections() {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        }

        // Показать главную (плитки сезонов)
        function showMainPage() {
            hideAllSections();
            document.getElementById('tabSeasons').classList.add('active');
            document.getElementById('seasons-main').classList.add('active');
            
            document.body.style.backgroundImage = 'none';
            document.getElementById('bgOverlay').style.opacity = '1';
        }

        // Показать архив всех персонажей
        function showAllCasting() {
            hideAllSections();
            document.getElementById('tabCasting').classList.add('active');
            document.getElementById('casting-all').classList.add('active');

            document.body.style.backgroundImage = 'none';
            document.getElementById('bgOverlay').style.opacity = '1';
        }

        // Открыть детали конкретного сезона
        function openSeason(id) {
            hideAllSections();
            document.getElementById('tabSeasons').classList.add('active');
            document.getElementById('season-detail').classList.add('active');

            const s = seasonsData[id];
            
            // Установка фона
            document.body.style.backgroundImage = s.bg;
            document.getElementById('bgOverlay').style.opacity = '0.85';

            // Заполнение текста
            document.getElementById('sdTitle').innerText = s.title;
            document.getElementById('sdConflict').innerText = s.conflict;
            document.getElementById('sdText').innerText = s.text;
            document.getElementById('sdConclusion').innerText = s.conclusion;

            // Рендер участников этого сезона
            const charGrid = document.getElementById('seasonCharGrid');
            charGrid.innerHTML = '';
            s.chars.forEach(charId => {
                charGrid.innerHTML += getCharCardHTML(charId);
            });
        }

        // Установка фонов для плиток главной страницы (css variables)
        document.querySelectorAll('.season-tile').forEach(tile => {
            tile.style.setProperty('background-image', tile.style.getPropertyValue('--bg-url'));
        });

        // Таймкод эффекта камеры
        setInterval(() => {
            const date = new Date();
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            const ms = String(Math.floor(date.getMilliseconds() / 30)).padStart(2, '0');
            document.getElementById('timecode').innerText = `${h}:${m}:${s}:${ms}`;
        }, 30);
    </script>
</body>
</html>
